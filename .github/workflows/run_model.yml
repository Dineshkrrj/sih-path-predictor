name: Run Cyclone Path Inference

on:
  workflow_dispatch: # Allows manual button trigger in GitHub Actions UI

jobs:
  inference:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 🛠️ CRITICAL FIX: Lock dependencies to TensorFlow 2.15 to match your model's Keras version
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy==1.26.4 pandas==2.2.2 scikit-learn==1.5.0
        pip install tensorflow==2.15.0

    - name: Execute Model Inference Script
      run: |
        python run_inference.py

    - name: Upload Output Predictions Asset
      uses: actions/upload-artifact@v4
      with:
        name: cyclone-predictions-json
        path: cyclone_prediction_output.json
