name: Run Cyclone Path Inference

on:
  workflow_dispatch: 

jobs:
  inference:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 🛠️ CRITICAL: Grants the runner permission to write files back to your repo

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Installs the latest standard packages
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas scikit-learn tensorflow

    - name: Execute Model Inference Script
      run: |
        python run_inference.py

    # 🛠️ NEW STEP: Automatically commit and push the generated JSON file back into the repo
    - name: Commit and Push Output JSON File
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        # Check if the file exists and has changes before trying to commit
        if [ -f "cyclone_prediction_output.json" ]; then
          git add cyclone_prediction_output.json
          git diff-index --quiet HEAD || git commit -m "Automated update: Generated cyclone path predictions"
          git push
        else
          echo "Error: Output file not found, skipping commit."
          exit 1
        fi
